# Labeler configuration for BoardTAU repository (actions/labeler@v5 format)

'area: ai':
  - changed-files:
      - any-glob-to-any-file:
          - 'app/api/ai/**/*'
          - 'lib/ai/**/*'
          - 'components/ai/**/*'

'area: auth':
  - changed-files:
      - any-glob-to-any-file:
          - 'app/api/auth/**/*'
          - 'lib/auth/**/*'
          - 'middleware.ts'

'area: database':
  - changed-files:
      - any-glob-to-any-file:
          - 'prisma/**/*'
          - 'lib/prisma.ts'

'area: ui':
  - changed-files:
      - any-glob-to-any-file:
          - 'components/**/*'
          - 'app/**/*.tsx'

'area: security':
  - changed-files:
      - any-glob-to-any-file:
          - 'lib/security/**/*'
          - '.github/workflows/codeql.yml'
          - '.github/workflows/dependency-review.yml'

'area: devops':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**/*'
          - 'package.json'
          - 'next.config.mjs'
